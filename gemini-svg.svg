<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="50%" stop-color="#ff8da1" />
      <stop offset="100%" stop-color="#e94f87" />
    </linearGradient>

    <!-- 사운드 웨이브 그래픽용 그라데이션 -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- 그림자 효과 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5a1832" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 핑크 배경 -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- 배경에 깔리는 은은한 오디오 파형 그래픽 -->
  <g fill="url(#wave-grad)" opacity="0.4">
    <rect x="150" y="260" width="12" height="110" rx="6" />
    <rect x="180" y="210" width="12" height="210" rx="6" />
    <rect x="210" y="170" width="12" height="290" rx="6" />
    <rect x="240" y="230" width="12" height="170" rx="6" />
    <rect x="270" y="280" width="12" height="70" rx="6" />
    
    <rect x="910" y="280" width="12" height="70" rx="6" />
    <rect x="940" y="230" width="12" height="170" rx="6" />
    <rect x="970" y="170" width="12" height="290" rx="6" />
    <rect x="1000" y="210" width="12" height="210" rx="6" />
    <rect x="1030" y="260" width="12" height="110" rx="6" />
  </g>

  <!-- 테두리 라인 프레임 -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />

  <!-- 중앙 메인 텍스트 그룹 -->
  <g filter="url(#shadow)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif">
    <!-- 서브 타이틀 상단 라벨 -->
    <rect x="460" y="170" width="280" height="40" rx="20" fill="#ffffff" fill-opacity="0.2" />
    <text x="600" y="196" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="4">VOCAL TUNE &amp; MIXING</text>

    <!-- 메인 타이틀: Io. MIX COMMISSION -->
    <text x="600" y="335" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="2">
      Io. MIX COMMISSION
    </text>

    <!-- 하단 포인트 장식 라인 -->
    <line x1="450" y1="390" x2="750" y2="390" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="600" cy="390" r="6" fill="#ffffff" />

    <!-- 하단 설명 문구 -->
    <text x="600" y="450" font-size="28" font-weight="700" fill="#ffffff" opacity="0.95" letter-spacing="1">
      보컬 튜닝 · 믹싱 · 마스터링 커미션
    </text>
  </g>
</svg>
